[project]
name = "astro-app"
version = "0.1.0"
description = "Open-source natal chart reading app: gated two-engine calculation + agentic interpretation via Sign in with ChatGPT"
requires-python = ">=3.10"
dependencies = [
    "pyswisseph>=2.10",
    "skyfield>=1.55",
    "jplephem>=2.24",
    "numpy>=2.0",
    "tzdata",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "certifi>=2026.10.18",  # indirect (httpx, skyfield); security floor (GHSA-6q48-6c7w-9gw2)
]

[project.scripts]
astro-app = "astro_app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "matplotlib>=3.9",  # golden wheel comparison only
    "pillow>=13.0.0; python_version >= '3.11'",  # indirect (matplotlib); security floor, pillow 13 needs 3.11+
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astro_app*"]
