[project]
name = "astro-app"
version = "0.1.0"
description = "Open-source natal chart reading app: gated two-engine calculation + agentic interpretation via Sign in with ChatGPT"
requires-python = ">=3.11"
dependencies = [
    "pyswisseph>=2.10",
    "skyfield>=1.55",
    "jplephem>=2.24",
    "numpy>=2.0",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
