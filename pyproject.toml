[project]
name = "astro-app"
version = "0.1.0"
description = "Open-source natal chart reading app: gated two-engine calculation + agentic interpretation via Sign in with ChatGPT"
requires-python = ">=3.10"
dependencies = [
    "pyswisseph>=2.10",
    "skyfield>=1.55",
    "jplephem>=2.24",
    "numpy>=2.0",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.9"]  # matplotlib: golden wheel comparison only

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astro_app*"]
